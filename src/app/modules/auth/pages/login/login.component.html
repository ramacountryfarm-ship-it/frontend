<div class="min-h-screen bg-brand-primary flex items-center justify-center px-4">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="flex justify-center mb-8">
      <img src="assets/logo.png" alt="Rama Country Farm" class="h-36 w-auto drop-shadow-lg">
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl p-8 shadow-xl">
      <p class="text-center text-sm text-ink-muted mb-6 font-medium">Sign in to your account</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <div *ngIf="errorMessage" class="mb-5 p-3 bg-red-50 border border-red-100 rounded-xl flex items-center gap-2">
          <svg class="w-4 h-4 text-[#FF3B30] flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
          </svg>
          <p class="text-sm text-[#FF3B30]">{{ errorMessage }}</p>
        </div>

        <div class="mb-4">
          <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Username</label>
          <input type="text" formControlName="username" placeholder="Enter your username"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-accent/40 focus:border-brand-accent transition-all bg-surface-muted"
            [class.border-red-300]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        </div>

        <div class="mb-7">
          <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Password</label>
          <input type="password" formControlName="password" placeholder="Enter your password"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-accent/40 focus:border-brand-accent transition-all bg-surface-muted"
            [class.border-red-300]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        </div>

        <button type="submit" [disabled]="isLoading"
          class="w-full py-3 px-4 bg-brand-accent text-brand-primary text-sm font-bold rounded-xl hover:bg-[#d9a01f] transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-soft">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Signing in...
          </span>
        </button>

      </form>
    </div>

    <p class="text-center text-xs text-white/40 mt-6">Rama Country Farm &copy; {{ year }}</p>
  </div>
</div>
