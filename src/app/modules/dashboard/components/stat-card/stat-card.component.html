<div class="bg-white rounded-3xl shadow-card p-6 hover:shadow-card-hover transition-all duration-200">
  <div class="flex items-start justify-between">
    <div class="w-10 h-10 rounded-2xl flex items-center justify-center" [ngClass]="iconBgColor">
      <!-- Birds -->
      <svg *ngIf="icon === 'birds'" class="w-5 h-5" [ngClass]="iconColor" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c-1.5 0-3 .5-4 2-1.5 2.5-.5 5 1 6.5l-.5 2L7 15l1.5 1 2-1.5c.5.2 1 .3 1.5.3s1-.1 1.5-.3l2 1.5L17 15l-1.5-1.5-.5-2c1.5-1.5 2.5-4 1-6.5-1-1.5-2.5-2-4-2z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 21h6M12 15v6"/>
      </svg>
      <!-- Eggs -->
      <svg *ngIf="icon === 'eggs'" class="w-5 h-5" [ngClass]="iconColor" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3C8 3 5 9 5 14a7 7 0 0014 0c0-5-3-11-7-11z"/>
      </svg>
      <!-- Feed -->
      <svg *ngIf="icon === 'feed'" class="w-5 h-5" [ngClass]="iconColor" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m8.25 3v6.75m0 0l-3-3m3 3l3-3M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/>
      </svg>
      <!-- Stock -->
      <svg *ngIf="icon === 'stock'" class="w-5 h-5" [ngClass]="iconColor" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125"/>
      </svg>
      <!-- Profit -->
      <svg *ngIf="icon === 'profit'" class="w-5 h-5" [ngClass]="iconColor" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <div *ngIf="trend !== null" class="flex items-center gap-1 bg-surface-muted px-2 py-1 rounded-lg">
      <svg *ngIf="trend >= 0" class="w-3 h-3 text-[#34C759]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/>
      </svg>
      <svg *ngIf="trend < 0" class="w-3 h-3 text-[#FF3B30]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
      </svg>
      <span class="text-[11px] font-semibold" [class.text-[#34C759]]="trend >= 0" [class.text-[#FF3B30]]="trend < 0">
        {{ trend > 0 ? '+' : '' }}{{ trend }}%
      </span>
    </div>
  </div>
  <div class="mt-5">
    <p class="text-[32px] font-bold tracking-tight leading-none" [ngClass]="valueColor">{{ value }}</p>
    <p class="text-[11px] font-semibold text-ink-muted mt-2 uppercase tracking-wider">{{ title }}</p>
  </div>
</div>
