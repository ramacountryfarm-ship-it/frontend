<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-lg font-semibold text-ink-dark">Farmers</h2>
      <p class="text-sm text-ink-muted mt-0.5">Egg suppliers — country egg farmers</p>
    </div>
    <button (click)="onAdd()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-brand-primary text-white text-sm font-semibold rounded-2xl shadow-soft hover:bg-[#6b1f18] transition-colors">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      Add Farmer
    </button>
  </div>

  <div class="bg-white rounded-3xl shadow-card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead>
          <tr class="bg-surface-muted/60">
            <th class="text-left text-xs font-semibold text-ink-muted uppercase tracking-wider px-6 py-4">Name</th>
            <th class="text-left text-xs font-semibold text-ink-muted uppercase tracking-wider px-6 py-4">Village</th>
            <th class="text-left text-xs font-semibold text-ink-muted uppercase tracking-wider px-6 py-4">Phone</th>
            <th class="text-right text-xs font-semibold text-ink-muted uppercase tracking-wider px-6 py-4">Eggs Supplied</th>
            <th class="text-right text-xs font-semibold text-ink-muted uppercase tracking-wider px-6 py-4">Avg Price/Egg</th>
            <th class="text-right text-xs font-semibold text-ink-muted uppercase tracking-wider px-6 py-4">Outstanding</th>
            <th class="text-right text-xs font-semibold text-ink-muted uppercase tracking-wider px-6 py-4">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr *ngFor="let f of paginated" class="hover:bg-surface-muted transition-colors">
            <td class="px-6 py-4 text-sm font-medium text-ink-dark">{{ f.name }}</td>
            <td class="px-6 py-4 text-sm text-ink-body">{{ f.village || '-' }}</td>
            <td class="px-6 py-4 text-sm text-ink-body">{{ f.phone || '-' }}</td>
            <td class="px-6 py-4 text-sm text-ink-body text-right">{{ f.totalEggsSupplied | number }}</td>
            <td class="px-6 py-4 text-sm text-ink-body text-right">&#8377;{{ f.avgPricePerEgg }}</td>
            <td class="px-6 py-4 text-right">
              <span class="text-sm font-semibold" [ngClass]="f.outstanding > 0 ? 'text-[#FF3B30]' : 'text-ink-muted'">&#8377;{{ f.outstanding | number }}</span>
            </td>
            <td class="px-6 py-4 text-right">
              <div class="flex items-center justify-end gap-2">
                <button (click)="onEdit(f._id)" class="p-2 rounded-lg hover:bg-gray-100 text-gray-500 hover:text-gray-700 transition-colors">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z"/></svg>
                </button>
                <button (click)="onDeleteClick(f._id)" class="p-2 rounded-lg hover:bg-red-50 text-red-500 hover:text-red-700 transition-colors">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div *ngIf="!isLoading && farmers.length === 0" class="text-center py-16"><p class="text-sm text-ink-muted">No farmers added yet</p><button (click)="onAdd()" class="mt-3 text-sm font-medium text-brand-primary hover:underline">Add first farmer</button></div>
    <div *ngIf="isLoading" class="text-center py-16"><div class="animate-spin w-8 h-8 border-2 border-gray-200 border-t-brand-primary rounded-full mx-auto"></div></div>
  </div>
</div>
<app-confirm-dialog [visible]="showDeleteDialog" title="Delete Farmer" message="Delete this farmer?" confirmText="Delete" (confirmed)="onDeleteConfirm()" (cancelled)="onDeleteCancel()"></app-confirm-dialog>
