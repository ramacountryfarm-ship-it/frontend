<div class="max-w-2xl">
  <button (click)="onCancel()" class="inline-flex items-center gap-1.5 text-sm text-ink-muted hover:text-gray-700 mb-6 transition-colors">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
    Back to Resale
  </button>
  <div class="bg-white rounded-3xl shadow-card p-8">
    <h2 class="text-lg font-semibold text-ink-dark mb-6">{{ isEdit ? 'Edit Resale' : 'Record Egg Sale' }}</h2>
    <div *ngIf="isLoading" class="flex justify-center py-12"><div class="animate-spin w-8 h-8 border-2 border-gray-200 border-t-brand-primary rounded-full"></div></div>
    <form *ngIf="!isLoading" [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Customer *</label>
          <select formControlName="customer" [class.border-red-300]="form.get('customer')?.invalid && form.get('customer')?.touched" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
            <option value="">Select customer</option>
            <option *ngFor="let c of customers" [value]="c._id">{{ c.name }} ({{ c.type }})</option>
          </select>
          <p *ngIf="form.get('customer')?.invalid && form.get('customer')?.touched" class="text-xs text-[#FF3B30] mt-1">Customer is required</p>
        </div>
        <div>
          <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Date *</label>
          <input type="date" formControlName="date" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
        </div>
        <div>
          <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Quantity *</label>
          <input type="number" formControlName="quantity" min="1" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
        </div>
        <div>
          <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Unit</label>
          <select formControlName="unit" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
            <option *ngFor="let u of units" [value]="u">{{ u }}</option>
          </select>
        </div>
        <div>
          <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Price per Unit (&#8377;) *</label>
          <input type="number" step="0.01" formControlName="pricePerUnit" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
        </div>
        <div>
          <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Total Amount (&#8377;)</label>
          <input type="number" formControlName="totalAmount" readonly class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-muted text-sm text-ink-muted">
        </div>
        <div>
          <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Payment Status</label>
          <select formControlName="paymentStatus" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
            <option *ngFor="let s of paymentStatuses" [value]="s">{{ s }}</option>
          </select>
        </div>
        <div *ngIf="form.get('paymentStatus')?.value !== 'Paid'">
          <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Amount Received (&#8377;)</label>
          <input type="number" step="0.01" formControlName="amountReceived" min="0" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
        </div>
        <div *ngIf="form.get('paymentStatus')?.value !== 'Paid'">
          <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Payment Due Date</label>
          <input type="date" formControlName="paymentDueDate" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
        </div>
      </div>
      <div>
        <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Delivery Address</label>
        <input type="text" formControlName="deliveryAddress" placeholder="Auto-filled from customer" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
      </div>
      <div>
        <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Notes</label>
        <textarea formControlName="notes" rows="3" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary resize-none"></textarea>
      </div>
      <div class="flex items-center gap-3 pt-4">
        <button type="submit" [disabled]="isSaving || form.invalid" class="px-6 py-2.5 bg-brand-primary text-white text-sm font-medium rounded-2xl shadow-soft hover:bg-[#6b1f18] transition-colors disabled:opacity-50">{{ isSaving ? 'Saving...' : (isEdit ? 'Update' : 'Record Sale') }}</button>
        <button type="button" (click)="onCancel()" class="px-6 py-2.5 text-sm font-medium text-ink-dark bg-surface-muted rounded-2xl hover:bg-gray-200 transition-colors">Cancel</button>
      </div>
    </form>
  </div>
</div>
