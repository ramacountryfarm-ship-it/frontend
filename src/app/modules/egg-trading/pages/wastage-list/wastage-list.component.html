<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-lg font-semibold text-ink-dark">Wastage Log</h2>
      <p class="text-sm text-ink-muted mt-0.5">Track broken, expired, or damaged trading eggs</p>
    </div>
    <button (click)="onAddClick()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-brand-primary text-white text-sm font-semibold rounded-2xl shadow-soft hover:bg-[#6b1f18] transition-colors">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      Log Wastage
    </button>
  </div>

  <!-- Total -->
  <div class="bg-white rounded-3xl shadow-card p-5">
    <p class="text-xs text-ink-muted uppercase tracking-wide font-medium">Total Wasted</p>
    <p class="text-2xl font-bold text-[#FF3B30] mt-1">{{ data.totalWasted | number }} eggs</p>
  </div>

  <!-- Inline Form -->
  <div *ngIf="showForm" class="bg-white rounded-3xl shadow-card p-6">
    <h3 class="text-[15px] font-semibold text-ink-dark mb-4">{{ editId ? 'Edit Wastage' : 'Log Wastage' }}</h3>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Date *</label>
        <input type="date" formControlName="date" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
      </div>
      <div>
        <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Quantity (eggs) *</label>
        <input type="number" formControlName="quantity" min="1" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
      </div>
      <div>
        <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Reason *</label>
        <select formControlName="reason" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
          <option *ngFor="let r of reasons" [value]="r">{{ r }}</option>
        </select>
      </div>
      <div>
        <label class="block text-[13px] font-medium text-ink-dark mb-1.5">Notes</label>
        <input type="text" formControlName="notes" class="w-full px-4 py-3 rounded-xl border border-surface-muted bg-surface-input text-sm focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary">
      </div>
      <div class="sm:col-span-2 flex gap-3">
        <button type="submit" [disabled]="isSaving || form.invalid" class="px-6 py-2.5 bg-brand-primary text-white text-sm font-medium rounded-2xl shadow-soft hover:bg-[#6b1f18] disabled:opacity-50">{{ isSaving ? 'Saving...' : (editId ? 'Update' : 'Log Wastage') }}</button>
        <button type="button" (click)="showForm=false" class="px-6 py-2.5 text-sm font-medium text-ink-dark bg-surface-muted rounded-2xl hover:bg-gray-200">Cancel</button>
      </div>
    </form>
  </div>

  <div class="bg-white rounded-3xl shadow-card overflow-hidden">
    <table class="w-full">
      <thead><tr class="bg-surface-muted/60">
        <th class="text-left text-xs font-semibold text-ink-muted uppercase tracking-wider px-6 py-4">Date</th>
        <th class="text-right text-xs font-semibold text-ink-muted uppercase tracking-wider px-6 py-4">Quantity</th>
        <th class="text-left text-xs font-semibold text-ink-muted uppercase tracking-wider px-6 py-4">Reason</th>
        <th class="text-left text-xs font-semibold text-ink-muted uppercase tracking-wider px-6 py-4">Notes</th>
        <th class="text-right text-xs font-semibold text-ink-muted uppercase tracking-wider px-6 py-4">Actions</th>
      </tr></thead>
      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let r of data.records" class="hover:bg-surface-muted transition-colors">
          <td class="px-6 py-4 text-sm text-ink-dark">{{ r.date | date:'mediumDate' }}</td>
          <td class="px-6 py-4 text-sm font-semibold text-[#FF3B30] text-right">{{ r.quantity }}</td>
          <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-full text-xs font-medium bg-red-100 text-red-700">{{ r.reason }}</span></td>
          <td class="px-6 py-4 text-sm text-ink-muted">{{ r.notes || '-' }}</td>
          <td class="px-6 py-4 text-right">
            <div class="flex items-center justify-end gap-2">
              <button (click)="onEditClick(r)" class="p-2 rounded-lg hover:bg-gray-100 text-gray-500"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z"/></svg></button>
              <button (click)="onDeleteClick(r._id)" class="p-2 rounded-lg hover:bg-red-50 text-red-500"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg></button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="!isLoading && data.records?.length === 0" class="text-center py-12 text-sm text-ink-muted">No wastage records</div>
    <div *ngIf="isLoading" class="text-center py-12"><div class="animate-spin w-8 h-8 border-2 border-gray-200 border-t-brand-primary rounded-full mx-auto"></div></div>
  </div>
</div>
<app-confirm-dialog [visible]="showDeleteDialog" title="Delete Wastage" message="Delete this wastage record?" confirmText="Delete" (confirmed)="onDeleteConfirm()" (cancelled)="onDeleteCancel()"></app-confirm-dialog>
