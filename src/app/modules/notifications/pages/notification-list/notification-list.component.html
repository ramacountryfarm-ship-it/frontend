<div class="space-y-6">
  <div>
    <h2 class="text-lg font-semibold text-[#1d1d1f]">Notifications</h2>
    <p class="text-sm text-[#86868b] mt-0.5">All alerts and system notifications</p>
  </div>

  <!-- Notifications List -->
  <div class="space-y-3">
    <div *ngFor="let alert of alerts"
         class="bg-white rounded-2xl border p-5 transition-colors"
         [ngClass]="getAlertBg(alert.type)">
      <div class="flex items-start gap-4">
        <!-- Icon -->
        <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"
             [ngClass]="getIconBg(alert.type)">
          <!-- Critical -->
          <svg *ngIf="alert.type === 'critical'" class="w-5 h-5" [ngClass]="getIconColor(alert.type)" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
          </svg>
          <!-- Warning -->
          <svg *ngIf="alert.type === 'warning'" class="w-5 h-5" [ngClass]="getIconColor(alert.type)" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
          </svg>
          <!-- Info -->
          <svg *ngIf="alert.type === 'info'" class="w-5 h-5" [ngClass]="getIconColor(alert.type)" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/>
          </svg>
          <!-- Default -->
          <svg *ngIf="alert.type !== 'critical' && alert.type !== 'warning' && alert.type !== 'info'" class="w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
          </svg>
        </div>

        <!-- Content -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <p class="text-[14px] font-semibold text-[#1d1d1f]">{{ alert.title }}</p>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase tracking-wide"
                  [ngClass]="getTypeBadge(alert.type)">
              {{ getTypeLabel(alert.type) }}
            </span>
          </div>
          <p class="text-[13px] text-[#424245] leading-relaxed">{{ alert.message }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && alerts.length === 0" class="bg-white rounded-2xl border border-gray-200/60 py-20 text-center">
    <svg class="w-12 h-12 text-[#d2d2d7] mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
    </svg>
    <p class="text-[15px] font-medium text-[#1d1d1f]">All clear</p>
    <p class="text-[13px] text-[#86868b] mt-1">No notifications at the moment</p>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="text-center py-16">
    <div class="animate-spin w-8 h-8 border-2 border-gray-200 border-t-brand-primary rounded-full mx-auto"></div>
  </div>
</div>
