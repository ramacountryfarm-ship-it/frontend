<div class="p-6">
  <div class="flex items-center gap-3 mb-6">
    <a routerLink="/reports" class="text-ink-muted hover:text-ink-dark text-sm">← Reports</a>
    <h1 class="text-2xl font-bold text-ink-dark">Egg Production Trend</h1>
  </div>

  <!-- Range filters -->
  <div class="flex gap-2 mb-6">
    <button *ngFor="let r of [{l:'Last 7 days',d:7},{l:'Last 30 days',d:30},{l:'Last 90 days',d:90}]"
            (click)="setRange(r.l, r.d)"
            class="px-4 py-1.5 rounded-full text-sm font-semibold transition"
            [class.bg-brand-primary]="rangeLabel === r.l" [class.text-white]="rangeLabel === r.l"
            [class.bg-white]="rangeLabel !== r.l" [class.text-ink-muted]="rangeLabel !== r.l"
            [class.border]="rangeLabel !== r.l" [class.border-gray-200]="rangeLabel !== r.l">
      {{ r.l }}
    </button>
  </div>

  <div *ngIf="loading" class="flex justify-center py-16">
    <div class="animate-spin w-8 h-8 border-2 border-brand-primary border-t-transparent rounded-full"></div>
  </div>

  <div *ngIf="!loading">
    <!-- Summary -->
    <div class="grid grid-cols-4 gap-3 mb-6">
      <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-4 text-center">
        <p class="text-xs text-yellow-600 font-semibold">Total Eggs</p>
        <p class="text-2xl font-bold text-yellow-700">{{ (totals.eggs || 0) | number }}</p>
      </div>
      <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center">
        <p class="text-xs text-blue-500 font-semibold">Avg / Day</p>
        <p class="text-2xl font-bold text-blue-700">{{ avgPerDay }}</p>
      </div>
      <div class="bg-orange-50 border border-orange-200 rounded-xl p-4 text-center">
        <p class="text-xs text-orange-500 font-semibold">Broken</p>
        <p class="text-2xl font-bold text-orange-600">{{ totals.broken || 0 }}</p>
      </div>
      <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-center">
        <p class="text-xs text-red-500 font-semibold">Deaths</p>
        <p class="text-2xl font-bold text-red-600">{{ totals.deaths || 0 }}</p>
      </div>
    </div>

    <!-- Daily rows -->
    <div *ngIf="daily.length === 0" class="text-center py-8 text-ink-muted">No data for selected period.</div>
    <div class="space-y-2">
      <div *ngFor="let d of daily" class="bg-white rounded-xl shadow-card px-4 py-3">
        <div class="flex items-center justify-between mb-1.5">
          <p class="text-sm font-semibold text-ink-dark">{{ fmtDate(d._id) }}</p>
          <div class="flex items-center gap-4 text-sm">
            <span class="font-bold text-ink-dark">{{ d.eggs }} eggs</span>
            <span *ngIf="d.broken > 0" class="text-orange-500 text-xs">{{ d.broken }} broken</span>
            <span *ngIf="d.deaths > 0" class="text-red-500 text-xs">{{ d.deaths }} deaths</span>
          </div>
        </div>
        <div class="w-full h-2 bg-yellow-100 rounded-full overflow-hidden">
          <div class="h-full bg-yellow-400 rounded-full transition-all" [style.width.%]="progress(d.eggs) * 100"></div>
        </div>
      </div>
    </div>
  </div>
</div>
