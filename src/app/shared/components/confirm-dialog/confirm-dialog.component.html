<div *ngIf="visible" class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/30 backdrop-blur-[2px]" (click)="onCancel()"></div>
  <!-- Dialog -->
  <div class="relative bg-white rounded-3xl shadow-elevated max-w-sm w-full mx-4 p-8 animate-in">
    <div class="w-12 h-12 rounded-2xl bg-red-50 flex items-center justify-center mx-auto mb-5">
      <svg class="w-6 h-6 text-[#FF3B30]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
      </svg>
    </div>
    <h3 class="text-[16px] font-bold text-ink-dark text-center mb-1.5">{{ title }}</h3>
    <p class="text-sm text-ink-muted text-center mb-7">{{ message }}</p>
    <div class="flex items-center gap-3">
      <button
        (click)="onCancel()"
        class="flex-1 px-4 py-3 text-sm font-semibold text-ink-dark bg-surface-muted rounded-2xl hover:bg-gray-200 transition-colors">
        {{ cancelText }}
      </button>
      <button
        (click)="onConfirm()"
        class="flex-1 px-4 py-3 text-sm font-semibold text-white bg-[#FF3B30] rounded-2xl hover:bg-red-600 transition-colors shadow-soft">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
