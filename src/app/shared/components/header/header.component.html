<header class="sticky top-0 z-20 bg-white/90 backdrop-blur-xl shadow-soft">
  <div class="flex items-center justify-between h-16 px-6 lg:px-8">
    <!-- Left: Hamburger + Title -->
    <div class="flex items-center gap-4">
      <button
        (click)="onToggleSidebar()"
        class="lg:hidden p-2 -ml-2 rounded-xl hover:bg-surface-muted transition-colors">
        <svg class="w-5 h-5 text-ink-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
        </svg>
      </button>
      <div>
        <h1 class="text-[17px] font-bold text-ink-dark tracking-tight">{{ pageTitle }}</h1>
      </div>
    </div>

    <!-- Right: Search + Notifications + User + Logout -->
    <div class="flex items-center gap-3">
      <!-- Notification Bell -->
      <div class="relative">
        <button
          (click)="toggleNotifications()"
          class="p-2.5 rounded-xl hover:bg-surface-muted transition-colors text-ink-muted hover:text-ink-dark relative"
          title="Notifications">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
          </svg>
          <span
            *ngIf="notificationCount > 0"
            class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 flex items-center justify-center rounded-full bg-[#FF3B30] text-white text-[10px] font-bold leading-none shadow-soft">
            {{ notificationCount }}
          </span>
        </button>

        <!-- Notification Dropdown -->
        <div
          *ngIf="showNotifications"
          class="absolute right-0 top-full mt-2 w-80 bg-white rounded-2xl shadow-dropdown z-50 overflow-hidden border border-surface-muted">
          <!-- Header -->
          <div class="flex items-center justify-between px-5 py-3.5 border-b border-surface-muted">
            <h3 class="text-[14px] font-bold text-ink-dark">Notifications</h3>
            <button *ngIf="notificationCount > 0" (click)="markAllAsRead()"
              class="text-[12px] font-semibold text-brand-primary hover:underline">
              Mark all read
            </button>
          </div>
          <!-- Unread Alert List -->
          <div class="max-h-72 overflow-y-auto">
            <div
              *ngFor="let alert of unreadAlerts"
              class="flex items-start gap-3 px-5 py-3.5 hover:bg-surface-muted/50 transition-colors cursor-default group">
              <div
                class="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0 mt-0.5"
                [ngClass]="getAlertClasses(alert.type)">
                <span class="text-sm">{{ getAlertIcon(alert.type) }}</span>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-[13px] font-semibold text-ink-dark truncate">{{ alert.title }}</p>
                <p class="text-[12px] text-ink-muted mt-0.5 line-clamp-2">{{ alert.message }}</p>
              </div>
              <button (click)="markAsRead(alert)" title="Mark as read"
                class="opacity-0 group-hover:opacity-100 p-1 rounded-lg hover:bg-gray-200 transition-all flex-shrink-0 mt-0.5">
                <svg class="w-3.5 h-3.5 text-ink-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
                </svg>
              </button>
            </div>
            <!-- Empty State -->
            <div
              *ngIf="unreadAlerts.length === 0"
              class="px-5 py-10 text-center">
              <svg class="w-10 h-10 text-ink-faint mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <p class="text-[13px] text-ink-muted font-medium">All caught up</p>
            </div>
          </div>
          <!-- Footer: See All -->
          <div class="border-t border-surface-muted">
            <button (click)="goToNotifications()"
              class="w-full px-5 py-3 text-[13px] font-semibold text-brand-primary hover:bg-surface-muted transition-colors text-center">
              See All Notifications
            </button>
          </div>
        </div>
      </div>

      <!-- Backdrop overlay -->
      <div
        *ngIf="showNotifications"
        (click)="closeNotifications()"
        class="fixed inset-0 z-40">
      </div>

      <!-- User -->
      <div class="flex items-center gap-2.5 pl-2">
        <div class="w-9 h-9 rounded-xl bg-brand-primary flex items-center justify-center shadow-soft">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
          </svg>
        </div>
        <span class="text-[13px] font-semibold text-ink-dark hidden sm:block">{{ userName }}</span>
      </div>

      <!-- Logout -->
      <button
        (click)="logout()"
        class="p-2.5 rounded-xl hover:bg-surface-muted transition-colors text-ink-muted hover:text-ink-dark"
        title="Logout">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/>
        </svg>
      </button>
    </div>
  </div>
</header>
